name: Update charter flight data

on:
  schedule:
    # 12:00 UTC Wednesday (07:00 ET) -- posts go up Tuesday.
    - cron: "0 12 * * 3"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch every post, ignoring the HTML cache"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs race each other onto the same branch.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so a rebase before push can succeed

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          cache-version: 1

      - name: Scrape and rebuild
        run: Rscript scripts/update.R ${{ inputs.refresh && '--refresh' || '' }}

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inst/extdata cache/html
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update charter flight data [skip ci]"
          # main can move between checkout and push -- an edit through the web
          # UI, or an overlapping run -- so rebase onto the latest and retry
          # rather than failing the whole run on a stale ref.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main (attempt $attempt)."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "Could not push after 3 attempts."
          exit 1
