name: Update charter flight data

on:
  schedule:
    # 12:00 UTC Wednesday (07:00 ET) -- posts go up Tuesday.
    - cron: "0 12 * * 3"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch every post, ignoring the HTML cache"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          cache-version: 1

      - name: Scrape and rebuild
        run: Rscript scripts/update.R ${{ inputs.refresh && '--refresh' || '' }}

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inst/extdata cache/html
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update charter flight data [skip ci]"
            git push
          fi
